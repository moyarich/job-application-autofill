name: moyaapply

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: moyaapply:local
    command: ["node", "server/index.mjs"]
    environment:
      NODE_ENV: development
      AUTOFILL_PORT: "4177"
      AUTOFILL_HOST: "0.0.0.0"
      AUTOFILL_ORIGIN: "http://localhost:${MOYA_WEB_PORT:-5173}"
      PYTHON_EXECUTABLE: /opt/venv/bin/python
      HEADLESS: "true"
      CONTAINER_MODE: "true"
    expose:
      - "4177"
    init: true
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4177/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - screenshots:/app/screenshots

  web:
    image: moyaapply:local
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["npm", "run", "dev", "--workspace", "apps/playground", "--", "--host", "0.0.0.0"]
    environment:
      VITE_API_PROXY_TARGET: http://api:4177
    ports:
      - "127.0.0.1:${MOYA_WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    init: true

volumes:
  screenshots:
