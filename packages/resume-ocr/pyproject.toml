[tool.poetry]
name = "resume-ocr"
version = "0.1.0"
description = "Local PDF text extraction with scanned-page OCR fallback for job-application-autofill"
authors = ["job-application-autofill contributors"]
readme = "README.md"
packages = [{ include = "resume_ocr" }]

[tool.poetry.scripts]
resume-ocr = "resume_ocr.pdf_ocr:main"

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
pypdfium2 = ">=4.30,<6"
rapidocr = ">=3.10,<4"
onnxruntime = ">=1.31,<2"
pillow = ">=10,<13"

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
reportlab = ">=4,<5"

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"
