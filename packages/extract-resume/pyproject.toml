[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "moya-extract-resume-ocr"
version = "0.1.0"
description = "Local PDF text extraction with scanned-page OCR fallback for MoyaApply"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pypdfium2>=4.30,<6",
  "rapidocr>=3.10,<4",
  "onnxruntime>=1.18,<2",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
test = ["reportlab>=4,<5"]

[tool.setuptools]
py-modules = ["pdf_ocr"]
package-dir = { "" = "python" }
