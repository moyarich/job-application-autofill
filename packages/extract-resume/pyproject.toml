[tool.poetry]
name = "job-application-autofill-extract-resume-ocr"
version = "0.1.0"
description = "Local PDF text extraction with scanned-page OCR fallback for job-application-autofill"
authors = ["job-application-autofill contributors"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
pypdfium2 = ">=4.30,<6"
rapidocr = ">=3.10,<4"
onnxruntime = ">=1.18,<2"
pillow = ">=10,<13"

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
reportlab = ">=4,<5"

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"
