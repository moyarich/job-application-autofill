<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Application browser</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #172033;
        color: white;
        font: 14px system-ui;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      #status {
        padding: 9px 14px;
        background: #243149;
      }
      #screen {
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }
      #paste-input {
        position: fixed;
        width: 1px;
        height: 1px;
        opacity: 0;
        left: -100px;
        top: 0;
      }
      #site-menu {
        position: fixed;
        z-index: 100;
        right: 18px;
        top: 72px;
        display: none;
        max-width: min(300px, calc(100vw - 24px));
        border-radius: 22px;
        background: #f8fafc;
        color: #172033;
        box-shadow: 0 12px 32px #0008;
        border: 1px solid #b8c7da;
        overflow: hidden;
      }
      #site-menu.visible {
        display: block;
      }
      #menu-handle {
        width: 100%;
        display: flex;
        gap: 10px;
        align-items: center;
        border: 0;
        padding: 10px 14px;
        color: white;
        background: #243958;
        cursor: grab;
        touch-action: none;
        font: 600 13px system-ui;
      }
      #menu-handle:active {
        cursor: grabbing;
      }
      #menu-list {
        display: none;
        max-height: 42vh;
        overflow: auto;
        padding: 7px;
      }
      #site-menu.expanded #menu-list {
        display: grid;
        gap: 6px;
      }
      #menu-list button {
        border: 1px solid #d7dfec;
        background: white;
        border-radius: 12px;
        color: #172033;
        padding: 9px 12px;
        text-align: left;
        cursor: pointer;
        font: 13px system-ui;
      }
      #menu-list button:hover:enabled {
        background: #e8f1ff;
      }
      #menu-list button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      #menu-handle:focus-visible,
      #menu-list button:focus-visible {
        outline: 3px solid #60a5fa;
        outline-offset: -3px;
      }
      #automation-actions { display: flex; gap: 7px; padding: 9px; border-bottom: 1px solid #d7dfec; }
      #automation-actions button { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid #ccd5e1; border-radius: 9px; background: #fff; color: #253454; cursor: pointer; font: 600 12px system-ui; }
      #automation-actions button:disabled { opacity: .5; cursor: not-allowed; }
      #automation-actions button:focus-visible { outline: 2px solid #60a5fa; }
      #automation-actions button.primary { background: #243958; color: #fff; }
      #automation-actions button.danger { color: #9f3535; }
      #automation-state { padding: 7px 12px 0; font: 11px system-ui; color: #566780; }
      #site-menu:not(.expanded) #automation-state, #site-menu:not(.expanded) #automation-actions { display: none; }
      #menu-message {
        font: 12px system-ui;
        padding: 0 10px;
        color: #263b64;
      }
      #site-menu.expanded #menu-message:not(:empty) {
        padding: 7px 10px;
      }
    </style>
  </head>
  <body>
    <div id="status" role="status">Connecting to your application browser…</div>
    <div id="screen"></div>
    <nav id="site-menu" aria-label="Employer actions">
      <button id="menu-handle" type="button" aria-expanded="false">
        <span>⠿</span><span>Employer actions</span><span>▾</span>
      </button>
      <div id="automation-state" role="status"></div>
      <div id="automation-actions"></div>
      <div id="menu-list"></div>
      <div id="menu-message" role="status"></div>
    </nav>
    <textarea
      id="paste-input"
      tabindex="-1"
      aria-label="Application paste input"
      autocomplete="off"
      spellcheck="false"
    ></textarea>
    <script type="module">
      const status = document.getElementById("status");
      const session = new URLSearchParams(location.search).get("session");
      const profile =
        new URLSearchParams(location.search).get("profile") ||
        "00000000-0000-4000-8000-000000000001";
      const headers = { "X-Moya-Client": "dashboard", "X-Profile-Id": profile };
      let rfb;
      let connected = false;
      let copyRequested = false;
      let focusRequest = null;

      const siteMenu = document.getElementById("site-menu");
      const menuHandle = document.getElementById("menu-handle");
      const menuList = document.getElementById("menu-list");
      const menuMessage = document.getElementById("menu-message");
      const automationActions = document.getElementById("automation-actions");
      const automationState = document.getElementById("automation-state");
      let menuOpen = false;
      let menuBusy = false;
      let menuReload = null;
      let menuVersion = "";
      let menuClosed = false;
      let menuTimer;
      let suppressHandleClick = false;
      async function runSessionAction(action) {
        if ((menuBusy && !["pause", "close"].includes(action)) || !session) return;
        if (action === "close" && !window.confirm("Stop automation and close the application browser?")) return;
        menuBusy = true;
        menuMessage.textContent = action === "pause" ? "Pausing…" : action === "continue" ? "Continuing…" : "Closing…";
        void reloadEmployerMenu().catch(() => {});
        try {
          const response = await fetch("/api/apply/" + encodeURIComponent(session) + "/" + action, { method: "POST", headers });
          const result = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(result.error || "Automation action failed.");
          menuMessage.textContent = result.message || "Action completed.";
          if (action === "close") {
            menuClosed = true;
            clearInterval(menuTimer);
            siteMenu.classList.remove("visible");
            status.textContent = "Application browser session closed";
            return;
          }
        } catch (error) {
          menuMessage.textContent = error.message || "Automation action failed.";
        } finally {
          menuBusy = false;
          if (action !== "close") await reloadEmployerMenu().catch(() => {});
        }
      }
      function addSessionAction(label, action, className = "") {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = label;
        button.className = className;
        button.disabled = menuBusy && !["pause", "close"].includes(action);
        button.addEventListener("click", () => void runSessionAction(action));
        automationActions.appendChild(button);
      }
      async function reloadEmployerMenu() {
        if (!session || menuClosed) return;
        if (menuReload) return menuReload;
        menuReload = loadEmployerMenu();
        try {
          await menuReload;
        } finally {
          menuReload = null;
        }
      }
      async function loadEmployerMenu() {
        const base = "/api/apply/" + encodeURIComponent(session);
        const [sessionResponse, response] = await Promise.all([
          fetch(base, { headers, cache: "no-store" }),
          fetch(base + "/menu", { headers, cache: "no-store" }),
        ]);
        if (!sessionResponse.ok) {
          siteMenu.classList.remove("visible");
          return;
        }
        const active = await sessionResponse.json();
        const data = response.ok ? await response.json() : {};
        if (menuClosed) return;
        const items = Array.isArray(data.items) ? data.items : [];
        const version = JSON.stringify([active.state, active.paused, active.running, active.currentAction, active.message, items, menuBusy]);
        if (version === menuVersion) return;
        menuVersion = version;
        menuList.replaceChildren();
        automationActions.replaceChildren();
        const finished = ["submitted", "submission_unverified"].includes(active.state);
        const running = active.running || active.state === "preparing" || menuBusy;
        automationState.textContent = active.paused ? "Paused — browser remains available" :
          finished ? "Application finished" :
          running ? (active.currentAction ? "Running — " + active.currentAction : "Running") :
          active.state === "ready_for_review" ? "Ready for review" :
          active.state === "login_required" ? "Sign-in required" :
          active.state === "manual_intervention" ? "Needs attention" : "Running";
        if (!finished) {
          if (!running && (active.paused || ["manual_intervention", "login_required", "ready_for_review"].includes(active.state)))
            addSessionAction("Continue", "continue", "primary");
          else addSessionAction("Pause", "pause");
          addSessionAction("Stop", "close", "danger");
        } else addSessionAction("Close", "close");
        siteMenu.classList.add("visible");
        if (!menuBusy) menuMessage.textContent = active.message || "";
        for (const item of active.paused || finished ? [] : items) {
          if (typeof item.id !== "string" || typeof item.label !== "string")
            continue;
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = item.label;
          button.disabled = !item.available || running;
          button.addEventListener("click", async () => {
            if (menuBusy) return;
            menuBusy = true;
            menuMessage.textContent = "Running " + item.label + "…";
            void reloadEmployerMenu().catch(() => {});
            try {
              const response = await fetch(
                "/api/apply/" + encodeURIComponent(session) + "/menu",
                {
                  method: "POST",
                  headers: { ...headers, "Content-Type": "application/json" },
                  body: JSON.stringify({ itemId: item.id }),
                },
              );
              const result = await response.json();
              if (!response.ok)
                throw new Error(result.error || "Employer action failed.");
              menuMessage.textContent = "Completed. Review the employer form.";
            } catch (error) {
              menuMessage.textContent =
                error.message || "Employer action failed.";
            } finally {
              menuBusy = false;
              await reloadEmployerMenu().catch(() => {});
            }
          });
          menuList.appendChild(button);
        }
      }
      menuHandle.addEventListener("click", () => {
        if (suppressHandleClick) {
          suppressHandleClick = false;
          return;
        }
        if (menuBusy) return;
        menuOpen = !menuOpen;
        siteMenu.classList.toggle("expanded", menuOpen);
        menuHandle.setAttribute("aria-expanded", String(menuOpen));
        if (menuOpen)
          void reloadEmployerMenu().catch(() => {
            menuMessage.textContent = "Menu unavailable.";
          });
      });
      // Only the handle drags; the noVNC canvas keeps its own pointer controls.
      let menuDrag = null;
      menuHandle.addEventListener("pointerdown", (event) => {
        if (event.button !== 0) return;
        const rect = siteMenu.getBoundingClientRect();
        menuDrag = {
          x: event.clientX,
          y: event.clientY,
          left: rect.left,
          top: rect.top,
          moved: false,
        };
        menuHandle.setPointerCapture(event.pointerId);
      });
      menuHandle.addEventListener("pointermove", (event) => {
        if (!menuDrag) return;
        const dx = event.clientX - menuDrag.x,
          dy = event.clientY - menuDrag.y;
        if (Math.abs(dx) + Math.abs(dy) > 5) menuDrag.moved = true;
        if (!menuDrag.moved) return;
        siteMenu.style.left =
          Math.max(
            0,
            Math.min(
              window.innerWidth - siteMenu.offsetWidth,
              menuDrag.left + dx,
            ),
          ) + "px";
        siteMenu.style.top =
          Math.max(
            0,
            Math.min(
              window.innerHeight - siteMenu.offsetHeight,
              menuDrag.top + dy,
            ),
          ) + "px";
        siteMenu.style.right = "auto";
      });
      menuHandle.addEventListener("pointerup", () => {
        if (menuDrag?.moved) suppressHandleClick = true;
        menuDrag = null;
      });
      menuHandle.addEventListener("pointercancel", () => {
        menuDrag = null;
      });

      function focusRemoteKeyboard(force = false) {
        if (!rfb || !connected || document.hidden) return;
        if (force && document.activeElement === pasteInput) pasteInput.blur();
        rfb.viewOnly = false;
        if (
          document.activeElement !== pasteInput &&
          typeof rfb.focus === "function"
        )
          rfb.focus();
      }
      const screen = document.getElementById("screen");
      const pasteInput = document.getElementById("paste-input");
      function controlKey(letter) {
        rfb.sendKey(0xffeb, "MetaLeft", false);
        rfb.sendKey(0xffec, "MetaRight", false);
        rfb.sendKey(0xffe3, "ControlLeft", true);
        rfb.sendKey(letter.charCodeAt(0), "Key" + letter.toUpperCase());
        rfb.sendKey(0xffe3, "ControlLeft", false);
      }
      async function pasteText(text) {
        if (!connected)
          throw new Error("Connect to the application browser before pasting.");
        await focusApplication();
        // Insert as text in the selected employer field. This does not depend on
        // X11 clipboard ownership or send Enter keystrokes that could submit a form.
        for (const [key, code] of [
          [0xffeb, "MetaLeft"],
          [0xffec, "MetaRight"],
          [0xffe3, "ControlLeft"],
          [0xffe4, "ControlRight"],
        ])
          rfb.sendKey(key, code, false);
        const response = await fetch(
          "/api/apply/" + encodeURIComponent(session) + "/paste",
          {
            method: "POST",
            headers: { ...headers, "Content-Type": "application/json" },
            body: JSON.stringify({ text }),
          },
        );
        if (!response.ok) {
          const result = await response.json().catch(() => ({}));
          throw new Error(
            result.error ||
              "Paste failed. Select an employer field and try again.",
          );
        }
        pasteInput.value = "";
        focusRemoteKeyboard(true);
        status.textContent = "Connected to application browser";
      }
      document.addEventListener(
        "paste",
        (event) => {
          if (event.target !== pasteInput && !screen.contains(event.target))
            return;
          const text = event.clipboardData?.getData("text/plain");
          if (text === undefined) return;
          event.preventDefault();
          event.stopImmediatePropagation();
          void pasteText(text).catch((error) => {
            pasteInput.value = "";
            status.textContent = error.message;
          });
        },
        true,
      );
      screen.addEventListener(
        "keydown",
        (event) => {
          if (!(event.metaKey || event.ctrlKey) || !connected) return;
          const key = event.key.toLowerCase();
          if (event.metaKey && ["a", "x", "z", "y"].includes(key)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            controlKey(key);
            return;
          }
          if (key !== "v" && key !== "c") return;
          event.stopImmediatePropagation();
          if (key === "c") {
            event.preventDefault();
            copyRequested = true;
            controlKey("c");
            return;
          }
          // Keep the browser's native paste action. Focus an editable target so the
          // paste event supplies text without requesting clipboard-read permission.
          pasteInput.value = "";
          pasteInput.focus({ preventScroll: true });
        },
        true,
      );
      async function focusApplication() {
        if (!focusRequest) {
          focusRequest = (async () => {
            const response = await fetch(
              "/api/apply/" + encodeURIComponent(session) + "/focus",
              { method: "POST", headers },
            );
            if (!response.ok)
              throw new Error("This application browser session has ended.");
          })().finally(() => {
            focusRequest = null;
          });
        }
        // Never disable RFB while awaiting a screenshot or network response:
        // doing so drops keystrokes and can leave the viewer read-only on errors.
        await focusRequest;
        focusRemoteKeyboard();
      }
      try {
        if (!session)
          throw new Error("Open the browser from an application page.");
        const response = await fetch("/api/viewer/config", { headers });
        const config = await response.json();
        if (!response.ok)
          throw new Error(config.error || "Viewer configuration unavailable.");
        await reloadEmployerMenu().catch(() => {});
        menuTimer = setInterval(() => {
          if (connected && !document.hidden)
            void reloadEmployerMenu().catch(() => {});
        }, 1000);
        const { default: RFB } = await import("/vnc/core/rfb.js");
        const socket = new URL("/vnc/websockify", location.href);
        socket.protocol = location.protocol === "https:" ? "wss:" : "ws:";
        rfb = new RFB(document.getElementById("screen"), socket.href, {
          credentials: { password: config.password },
        });
        rfb.scaleViewport = true;
        rfb.resizeSession = false;
        rfb.addEventListener("connect", () => {
          connected = true;
          status.textContent = "Connected to application browser";
          void focusApplication().catch((error) => {
            status.textContent = error.message;
          });
        });
        screen.addEventListener("pointerdown", () => {
          focusRemoteKeyboard(true);
          void focusApplication().catch((error) => {
            status.textContent = error.message;
          });
        });
        rfb.addEventListener("disconnect", () => {
          connected = false;
          status.textContent =
            "Browser disconnected. Reopen this viewer to reconnect.";
        });
        rfb.addEventListener("clipboard", (event) => {
          if (copyRequested) {
            copyRequested = false;
            void navigator.clipboard.writeText(event.detail.text).catch(() => {
              status.textContent =
                "Allow clipboard access for this page to copy text.";
            });
          }
        });
        rfb.addEventListener("securityfailure", () => {
          status.textContent =
            "Browser authentication failed. Check WEB_VNC_PASSWORD and restart the app.";
        });
        window.addEventListener("focus", () => {
          void focusApplication().catch((error) => {
            status.textContent = error.message;
          });
        });
        window.addEventListener("blur", () => {
          if (rfb) rfb.viewOnly = true;
        });
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) {
            if (rfb) rfb.viewOnly = true;
          } else
            void focusApplication().catch((error) => {
              status.textContent = error.message;
            });
        });
        window.addEventListener("pagehide", () => {
          clearInterval(menuTimer);
          rfb.disconnect();
        });
      } catch (error) {
        status.textContent =
          error.message || "Could not connect to application browser.";
      }
    </script>
  </body>
</html>
