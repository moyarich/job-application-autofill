<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Application browser</title>
<style>html,body{height:100%;margin:0;background:#172033;color:white;font:14px system-ui}body{display:flex;flex-direction:column}#status{padding:9px 14px;background:#243149}#screen{flex:1;min-height:0;overflow:hidden}#paste-input{position:fixed;width:1px;height:1px;opacity:0;left:-100px;top:0}</style></head>
<body><div id="status" role="status">Connecting to your application browser…</div><div id="screen"></div><textarea id="paste-input" tabindex="-1" aria-label="Application paste input" autocomplete="off" spellcheck="false"></textarea>
<script type="module">
const status = document.getElementById('status');
const session = new URLSearchParams(location.search).get('session');
const profile = new URLSearchParams(location.search).get('profile') || '00000000-0000-4000-8000-000000000001';
const headers = {'X-Moya-Client':'dashboard', 'X-Profile-Id':profile};
let rfb;
let connected = false;
let copyRequested = false;
let focusRequest = null;
function focusRemoteKeyboard(force = false) {
  if (!rfb || !connected || document.hidden) return;
  if (force && document.activeElement === pasteInput) pasteInput.blur();
  rfb.viewOnly = false;
  if (document.activeElement !== pasteInput && typeof rfb.focus === 'function') rfb.focus();
}
const screen = document.getElementById('screen');
const pasteInput = document.getElementById('paste-input');
function controlKey(letter) {
  rfb.sendKey(0xffeb,'MetaLeft',false);
  rfb.sendKey(0xffec,'MetaRight',false);
  rfb.sendKey(0xffe3,'ControlLeft',true);
  rfb.sendKey(letter.charCodeAt(0),'Key'+letter.toUpperCase());
  rfb.sendKey(0xffe3,'ControlLeft',false);
}
async function pasteText(text) {
  if(!connected) throw new Error('Connect to the application browser before pasting.');
  await focusApplication();
  // Insert as text in the selected employer field. This does not depend on
  // X11 clipboard ownership or send Enter keystrokes that could submit a form.
  for (const [key,code] of [[0xffeb,'MetaLeft'],[0xffec,'MetaRight'],[0xffe3,'ControlLeft'],[0xffe4,'ControlRight']]) rfb.sendKey(key,code,false);
  const response=await fetch('/api/apply/'+encodeURIComponent(session)+'/paste',{
    method:'POST',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({text})
  });
  if (!response.ok) {
    const result=await response.json().catch(()=>({}));
    throw new Error(result.error || 'Paste failed. Select an employer field and try again.');
  }
  pasteInput.value='';
  focusRemoteKeyboard(true);
  status.textContent='Connected to application browser';
}
document.addEventListener('paste',event=>{
  if(event.target!==pasteInput && !screen.contains(event.target)) return;
  const text=event.clipboardData?.getData('text/plain');
  if(text===undefined) return;
  event.preventDefault(); event.stopImmediatePropagation();
  void pasteText(text).catch(error=>{pasteInput.value='';status.textContent=error.message;});
},true);
screen.addEventListener('keydown',event=>{
  if(!(event.metaKey||event.ctrlKey)||!connected) return;
  const key=event.key.toLowerCase();
  if(event.metaKey && ['a','x','z','y'].includes(key)) {
    event.preventDefault();event.stopImmediatePropagation();controlKey(key);return;
  }
  if(key!=='v'&&key!=='c') return;
  event.stopImmediatePropagation();
  if(key==='c') {event.preventDefault();copyRequested=true;controlKey('c');return;}
  // Keep the browser's native paste action. Focus an editable target so the
  // paste event supplies text without requesting clipboard-read permission.
  pasteInput.value='';
  pasteInput.focus({preventScroll:true});
},true);
async function focusApplication() {
  if (!focusRequest) {
    focusRequest = (async () => {
      const response = await fetch('/api/apply/'+encodeURIComponent(session)+'/focus',{method:'POST',headers});
      if (!response.ok) throw new Error('This application browser session has ended.');
    })().finally(() => { focusRequest = null; });
  }
  // Never disable RFB while awaiting a screenshot or network response:
  // doing so drops keystrokes and can leave the viewer read-only on errors.
  await focusRequest;
  focusRemoteKeyboard();
}
try {
  if(!session) throw new Error('Open the browser from an application page.');
  const response = await fetch('/api/viewer/config',{headers});
  const config = await response.json();
  if(!response.ok) throw new Error(config.error || 'Viewer configuration unavailable.');
  const {default:RFB} = await import('/vnc/core/rfb.js');
  const socket = new URL('/vnc/websockify',location.href);
  socket.protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  rfb = new RFB(document.getElementById('screen'),socket.href,{credentials:{password:config.password}});
  rfb.scaleViewport = true;
  rfb.resizeSession = false;
  rfb.addEventListener('connect',()=>{connected=true;status.textContent='Connected to application browser';void focusApplication().catch(error=>{status.textContent=error.message;});});
  screen.addEventListener('pointerdown',()=>{focusRemoteKeyboard(true);void focusApplication().catch(error=>{status.textContent=error.message;});});
  rfb.addEventListener('disconnect',()=>{connected=false;status.textContent='Browser disconnected. Reopen this viewer to reconnect.';});
  rfb.addEventListener('clipboard',event=>{
    if(copyRequested) {
      copyRequested=false;
      void navigator.clipboard.writeText(event.detail.text).catch(()=>{status.textContent='Allow clipboard access for this page to copy text.';});
    }
  });
  rfb.addEventListener('securityfailure' ,()=>{status.textContent='Browser authentication failed. Check WEB_VNC_PASSWORD and restart the app.';});
  window.addEventListener('focus',()=>{void focusApplication().catch(error=>{status.textContent=error.message;});});
  window.addEventListener('blur',()=>{if(rfb)rfb.viewOnly=true;});
  document.addEventListener('visibilitychange',()=>{if(document.hidden) { if(rfb) rfb.viewOnly=true; } else void focusApplication().catch(error=>{status.textContent=error.message;});});
  window.addEventListener('pagehide',()=>rfb.disconnect());
} catch(error) {status.textContent=error.message || 'Could not connect to application browser.';}
</script></body></html>
