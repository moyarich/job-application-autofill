<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Application browser</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #172033;
        color: white;
        font: 14px system-ui;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      #status {
        display: flex;
        align-items: center;
        flex-shrink: 0;
        min-height: 108px;
        padding: 20px 280px 20px 20px;
        background: #243149;
        border-bottom: 1px solid #27272a;
      }
      #screen {
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }
      #paste-input {
        position: fixed;
        width: 1px;
        height: 1px;
        opacity: 0;
        left: -100px;
        top: 0;
      }
      * { box-sizing: border-box; }
      #status { background: #18181b; color: #d4d4d8; font-size: 12px; }
      #site-menu {
        position: fixed;
        z-index: 100;
        right: 16px;
        top: 16px;
        display: none;
        width: 240px;
        max-width: calc(100vw - 24px);
        max-height: calc(100dvh - 24px);
        border: 1px solid #e4e4e7;
        border-radius: 12px;
        background: #fff;
        color: #18181b;
        box-shadow: 0 4px 6px -2px #00000008, 0 12px 32px -8px #00000026;
        overflow: hidden;
        font: 13px ui-sans-serif, system-ui, sans-serif;
      }
      #site-menu.visible { display: flex; flex-direction: column; }
      #site-menu.expanded { width: 296px; }
      #menu-handle {
        display: flex;
        align-items: center;
        gap: 9px;
        flex-shrink: 0;
        width: 100%;
        min-height: 44px;
        padding: 10px 12px;
        border: 0;
        background: #fff;
        color: #27272a;
        text-align: left;
        cursor: grab;
        touch-action: none;
        font: 500 13px ui-sans-serif, system-ui, sans-serif;
      }
      #menu-handle:hover { background: #fafafa; }
      #menu-handle:active { cursor: grabbing; }
      #menu-handle svg { width: 16px; height: 16px; flex-shrink: 0; color: #a1a1aa; }
      #menu-handle .menu-chevron { margin-left: auto; transition: transform .15s; }
      #site-menu.expanded .menu-chevron { transform: rotate(180deg); }
      #automation-state { padding: 0 12px 12px; color: #71717a; font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; }
      #automation-state::before { content: ''; display: inline-block; width: 6px; height: 6px; margin: 0 7px 1px 0; background: #a1a1aa; border-radius: 50%; }
      #automation-state[data-phase="running"]::before { background: #2563eb; animation: pulse 1.5s ease-in-out infinite; }
      #automation-state[data-phase="paused"]::before { background: #d97706; }
      #automation-state[data-phase="submitted"]::before { background: #16a34a; }
      #automation-actions { display: none; flex-shrink: 0; gap: 8px; padding: 0 12px 12px; border-bottom: 1px solid #e4e4e7; }
      #site-menu.expanded #automation-actions { display: flex; }
      #automation-actions button { display: flex; justify-content: center; align-items: center; gap: 6px; flex: 1; min-width: 0; min-height: 34px; padding: 7px 10px; border: 1px solid #e4e4e7; border-radius: 6px; background: #fff; color: #3f3f46; cursor: pointer; font: 500 12px ui-sans-serif, system-ui, sans-serif; }
      #automation-actions button:hover:enabled { background: #f4f4f5; }
      #automation-actions button.primary { color: #fff; background: #18181b; border-color: #18181b; }
      #automation-actions button.primary:hover:enabled { background: #303036; }
      #automation-actions button.danger { color: #b91c1c; }
      #automation-actions button.danger:hover:enabled { background: #fef2f2; border-color: #fecaca; }
      #menu-list { display: none; min-height: 0; overflow: auto; overscroll-behavior: contain; padding: 6px; scrollbar-width: thin; }
      #site-menu.expanded #menu-list:not(:empty) { display: grid; gap: 2px; }
      #menu-list button { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 36px; border: 0; border-radius: 6px; background: transparent; color: #27272a; padding: 8px 10px; text-align: left; cursor: pointer; font: 13px ui-sans-serif, system-ui, sans-serif; }
      #menu-list button:hover:enabled { background: #f4f4f5; }
      #menu-list button small { display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0; color: #a1a1aa; font-size: 10px; }
      .step-status-icon { width: 14px; height: 14px; flex-shrink: 0; }
      .step-status-icon.running { animation: status-spin 1s linear infinite; }
      @keyframes status-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .step-status-icon.running { animation: none; } }
      #menu-list button[data-active="true"] { background: #f4f4f5; }
      #menu-list button[data-active="true"] small { color: #2563eb; }
      #menu-list button[data-status="processed"] small { color: #15803d; }
      #menu-list button[data-status="filled"] small { color: #15803d; }
      #menu-list button[data-status="needs_review"] small { color: #a16207; }
      #menu-list button:disabled { color: #a1a1aa; cursor: not-allowed; }
      #automation-actions button:disabled { opacity: .5; cursor: not-allowed; }
      #site-menu button:focus-visible { outline: 2px solid #71717a; outline-offset: -2px; }
      #menu-footer { display: none; flex-shrink: 0; padding: 10px 12px; max-height: 190px; overflow: auto; border-top: 1px solid #e4e4e7; background: #fafafa; color: #71717a; font-size: 11px; line-height: 1.5; }
      #site-menu.expanded #menu-footer { display: block; }
      .menu-footer-summary { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: #3f3f46; font-weight: 500; }
      #menu-refresh { border: 0; border-radius: 4px; background: transparent; color: #71717a; font-size: 18px; width: 26px; height: 26px; cursor: pointer; }
      #menu-refresh:hover { background: #e4e4e7; }
      #menu-footer p { margin: 5px 0; }
      #site-menu.expanded #menu-footer #menu-message { padding: 6px 0 0; border: 0; }
      #menu-message { display: none; flex-shrink: 0; max-height: 100px; overflow: auto; color: #71717a; font-size: 11px; line-height: 1.6; overflow-wrap: anywhere; }
      #site-menu.expanded #menu-message:not(:empty) { display: block; padding: 10px 12px; border-top: 1px solid #e4e4e7; background: #fafafa; }
      @keyframes pulse { 50% { opacity: .35; } }
      @media (prefers-reduced-motion: reduce) { #automation-state::before { animation: none !important; } .menu-chevron { transition: none !important; } }
      @media (max-width: 600px) {
        #status { min-height: 148px; align-items: flex-start; padding: 14px 16px; }
        #site-menu { top: 52px; }
      }
    </style>
  </head>
  <body>
    <div id="status" role="status">Connecting to your application browser…</div>
    <div id="screen"></div>
    <nav id="site-menu" aria-label="Employer actions">
      <button id="menu-handle" type="button" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M8 5h.01M8 12h.01M8 19h.01M16 5h.01M16 12h.01M16 19h.01" stroke-linecap="round" stroke-width="3"/></svg>
        <span>Employer actions</span>
        <svg class="menu-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div id="automation-state" role="status"></div>
      <div id="automation-actions"></div>
      <div id="menu-list"></div>
      <footer id="menu-footer">
        <div class="menu-footer-summary"><span id="menu-summary"></span><button id="menu-refresh" type="button" aria-label="Refresh section status" title="Refresh section status">↻</button></div>
        <p id="menu-next-step"></p>
        <div id="menu-message" role="status"></div>
      </footer>
    </nav>
    <textarea
      id="paste-input"
      tabindex="-1"
      aria-label="Application paste input"
      autocomplete="off"
      spellcheck="false"
    ></textarea>
    <script type="module">
      const status = document.getElementById("status");
      const session = new URLSearchParams(location.search).get("session");
      const profile =
        new URLSearchParams(location.search).get("profile") ||
        "00000000-0000-4000-8000-000000000001";
      const headers = { "X-Moya-Client": "dashboard", "X-Profile-Id": profile };
      let rfb;
      let connected = false;
      let copyRequested = false;
      let focusRequest = null;

      const siteMenu = document.getElementById("site-menu");
      const menuHandle = document.getElementById("menu-handle");
      const menuList = document.getElementById("menu-list");
      const menuMessage = document.getElementById("menu-message");
      const automationActions = document.getElementById("automation-actions");
      const automationState = document.getElementById("automation-state");
      function showMenuError(message) {
        menuMessage.textContent = /expired|closed|ended/i.test(message || "")
          ? "Session ended. Reopen the application."
          : /fetch|network|connect/i.test(message || "") ? "Can’t connect. Try again."
          : "Couldn’t complete that action. Try again.";
      }
      let menuOpen = false;
      let menuBusy = false;
      let menuReload = null;
      let menuVersion = "";
      let menuClosed = false;
      let menuTimer;
      let suppressHandleClick = false;
      async function runSessionAction(action) {
        if ((menuBusy && !["pause", "close"].includes(action)) || !session) return;
        if (action === "close" && !window.confirm("Stop automation and close the application browser?")) return;
        menuBusy = true;
        menuMessage.textContent = "";
        void reloadEmployerMenu().catch(() => {});
        try {
          const response = await fetch("/api/apply/" + encodeURIComponent(session) + "/" + action, { method: "POST", headers });
          const result = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(result.error || "Automation action failed.");
          menuMessage.textContent = "";
          if (action === "close") {
            menuClosed = true;
            clearInterval(menuTimer);
            siteMenu.classList.remove("visible");
            status.textContent = "Application browser session closed";
            return;
          }
        } catch (error) {
          showMenuError(error.message);
        } finally {
          menuBusy = false;
          if (action !== "close") await reloadEmployerMenu().catch(() => {});
        }
      }
      function addSessionAction(label, action, className = "") {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = label;
        if (action === "continue") button.title = "Fill this page without advancing to the next employer step";
        button.className = className;
        button.disabled = menuBusy && !["pause", "close"].includes(action);
        button.addEventListener("click", () => void runSessionAction(action));
        automationActions.appendChild(button);
      }
      async function reloadEmployerMenu() {
        if (!session || menuClosed) return;
        if (menuReload) return menuReload;
        menuReload = loadEmployerMenu();
        try {
          await menuReload;
        } finally {
          menuReload = null;
        }
      }
      async function loadEmployerMenu() {
        const base = "/api/apply/" + encodeURIComponent(session);
        const [sessionResponse, response] = await Promise.all([
          fetch(base, { headers, cache: "no-store" }),
          fetch(base + "/menu", { headers, cache: "no-store" }),
        ]);
        if (!sessionResponse.ok) {
          siteMenu.classList.remove("visible");
          return;
        }
        const sessionSnapshot = await sessionResponse.json();
        const data = response.ok ? await response.json() : {};
        if (menuClosed) return;
        const items = Array.isArray(data.items) ? data.items : [];
        // Older running APIs also inspect the DOM before returning menu items:
        // a nonempty application menu means manual sign-in has completed.
        const active = data.session || (
          sessionSnapshot.state === "login_required" && items.length && !sessionSnapshot.running && !sessionSnapshot.paused
            ? { ...sessionSnapshot, state: "ready_for_review", message: "" }
            : sessionSnapshot
        );
        const version = JSON.stringify([active.state, active.paused, active.running, active.currentAction, active.message, items, menuBusy]);
        if (version === menuVersion) return;
        menuVersion = version;
        menuList.replaceChildren();
        automationActions.replaceChildren();
        const finished = ["submitted", "submission_unverified"].includes(active.state);
        const running = active.running || active.state === "preparing" || menuBusy;
        automationState.textContent = active.paused ? "Paused — browser remains available" :
          active.state === "submitted" ? "Submission confirmed" :
          active.state === "submission_unverified" ? "Submission not confirmed" :
          running ? (active.currentAction ? "Running — " + active.currentAction : "Running") :
          active.state === "ready_for_review" ? "Ready for review" :
          active.state === "login_required" ? "Sign-in required" :
          active.state === "manual_intervention" ? "Needs attention" : "Running";
        if (!finished) {
          if (!running && (active.paused || ["manual_intervention", "login_required", "ready_for_review"].includes(active.state)))
            addSessionAction("Resume autofill", "continue", "primary");
          else addSessionAction("Pause", "pause");
          addSessionAction("Stop", "close", "danger");
        } else addSessionAction("Close", "close");
        automationState.dataset.phase = active.paused ? "paused" : running ? "running" : active.state;
        menuHandle.title = automationState.textContent + " — drag to move, click to expand";
        siteMenu.classList.add("visible");

        const handled = items.filter((item) => ["filled", "processed"].includes(item.status)).length;
        const reviewItems = items.filter((item) => item.status === "needs_review");
        const readyItems = items.filter((item) => item.available && (!item.status || item.status === "ready"));
        document.getElementById("menu-summary").textContent = [handled ? `${handled} done` : "", reviewItems.length ? `${reviewItems.length} to check` : "", readyItems.length ? `${readyItems.length} ready` : ""].filter(Boolean).join(" · ");
        const manualItems = items.filter((item) => !item.available && item.status === "ready");
        const nextReview = reviewItems.find((item) => item.available) || reviewItems[0];
        document.getElementById("menu-next-step").textContent = active.paused ? "Paused" :
          running ? `Filling ${active.currentAction || "this page"}…` :
          active.state === "login_required" ? "Sign in to continue" :
          active.state === "manual_intervention" ? "Complete verification" :
          active.state === "submitted" ? "Application submitted" :
          active.state === "submission_unverified" ? "Check submission on employer site" :
          nextReview ? `Check ${nextReview.label}` :
          readyItems.length ? `Fill ${readyItems[0].label}` :
          manualItems.length ? `Enter ${manualItems[0].label}` :
          "Review, then Save and Continue on employer site";
        for (const item of active.paused || finished ? [] : items) {
          if (typeof item.id !== "string" || typeof item.label !== "string")
            continue;
          const button = document.createElement("button");
          button.type = "button";
          button.setAttribute("aria-label", item.label);
          const label = document.createElement("span");
          label.textContent = item.label;
          button.appendChild(label);
          const hint = document.createElement("small");
          hint.id = "step-status-" + encodeURIComponent(item.id);
          button.setAttribute("aria-describedby", hint.id);
          const isCurrent = running && active.currentAction === item.label;
          button.dataset.active = String(isCurrent);
          button.dataset.status = item.status || "";
          hint.textContent = isCurrent ? "Running" : item.status === "processed" ? "Processed" : item.status === "filled" ? "Filled" :
            item.status === "needs_review" ? "Needs review" : item.status === "ready" && !item.available ? "Manual entry" : !item.available ? "Not on this page" : "Ready";
          if (hint.textContent) {
            const icon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            icon.setAttribute("viewBox", "0 0 24 24");
            icon.setAttribute("aria-hidden", "true");
            icon.setAttribute("fill", "none");
            icon.setAttribute("stroke", "currentColor");
            icon.setAttribute("stroke-width", "1.8");
            icon.setAttribute("stroke-linecap", "round");
            icon.setAttribute("stroke-linejoin", "round");
            icon.setAttribute("class", "step-status-icon" + (isCurrent ? " running" : ""));
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", isCurrent ? "M12 3a9 9 0 1 1-9 9" :
              item.status === "processed" || item.status === "filled" ? "M22 11.1V12a10 10 0 1 1-5.9-9.1 M22 4 12 14l-3-3" :
              item.status === "needs_review" ? "M12 3 2 21h20L12 3Z M12 9v4 M12 17h.01" :
              item.available ? "M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20Z M10 8l5 4-5 4" :
              "M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20Z M7 12h10");
            icon.appendChild(path);
            hint.prepend(icon);
          }
          button.appendChild(hint);
          button.disabled = !item.available || running;
          button.addEventListener("click", async () => {
            if (menuBusy) return;
            menuBusy = true;
            menuMessage.textContent = "";
            void reloadEmployerMenu().catch(() => {});
            try {
              const response = await fetch(
                "/api/apply/" + encodeURIComponent(session) + "/menu",
                {
                  method: "POST",
                  headers: { ...headers, "Content-Type": "application/json" },
                  body: JSON.stringify({ itemId: item.id }),
                },
              );
              const result = await response.json();
              if (!response.ok)
                throw new Error(result.error || "Employer action failed.");
              menuMessage.textContent = "";
            } catch (error) {
              showMenuError(error.message);
            } finally {
              menuBusy = false;
              await reloadEmployerMenu().catch(() => {});
            }
          });
          menuList.appendChild(button);
        }
      }
      document.getElementById("menu-refresh").addEventListener("click", () => {
        menuVersion = "";
        void reloadEmployerMenu().catch(() => { showMenuError("connection"); });
      });
      let menuMoved = false;
      function fitMenu() {
        if (!menuMoved) {
          siteMenu.style.left = "auto";
          siteMenu.style.right = "16px";
          siteMenu.style.top = window.innerWidth <= 600 ? "52px" : "16px";
        }
        const rect = siteMenu.getBoundingClientRect();
        if (!rect.width) return;
        const left = Math.max(8, Math.min(rect.left, window.innerWidth - rect.width - 8));
        const top = Math.max(8, Math.min(rect.top, window.innerHeight - rect.height - 8));
        siteMenu.style.left = left + "px";
        siteMenu.style.top = top + "px";
        siteMenu.style.right = "auto";
      }
      new ResizeObserver(fitMenu).observe(siteMenu);
      window.addEventListener("resize", fitMenu);
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && menuOpen) {
          menuOpen = false;
          siteMenu.classList.remove("expanded");
          menuHandle.setAttribute("aria-expanded", "false");
          menuHandle.focus();
        }
      });
      menuHandle.addEventListener("click", () => {
        if (suppressHandleClick) {
          suppressHandleClick = false;
          return;
        }
        menuOpen = !menuOpen;
        siteMenu.classList.toggle("expanded", menuOpen);
        menuHandle.setAttribute("aria-expanded", String(menuOpen));
        if (menuOpen)
          void reloadEmployerMenu().catch(() => {
            showMenuError("connection");
          });
      });
      // Only the handle drags; the noVNC canvas keeps its own pointer controls.
      let menuDrag = null;
      menuHandle.addEventListener("pointerdown", (event) => {
        if (event.button !== 0) return;
        const rect = siteMenu.getBoundingClientRect();
        menuDrag = {
          x: event.clientX,
          y: event.clientY,
          left: rect.left,
          top: rect.top,
          moved: false,
        };
        menuHandle.setPointerCapture(event.pointerId);
      });
      menuHandle.addEventListener("pointermove", (event) => {
        if (!menuDrag) return;
        const dx = event.clientX - menuDrag.x,
          dy = event.clientY - menuDrag.y;
        if (Math.abs(dx) + Math.abs(dy) > 5) menuDrag.moved = true;
        if (!menuDrag.moved) return;
        menuMoved = true;
        siteMenu.style.left =
          Math.max(
            0,
            Math.min(
              window.innerWidth - siteMenu.offsetWidth,
              menuDrag.left + dx,
            ),
          ) + "px";
        siteMenu.style.top =
          Math.max(
            0,
            Math.min(
              window.innerHeight - siteMenu.offsetHeight,
              menuDrag.top + dy,
            ),
          ) + "px";
        siteMenu.style.right = "auto";
      });
      menuHandle.addEventListener("pointerup", () => {
        if (menuDrag?.moved) suppressHandleClick = true;
        menuDrag = null;
      });
      menuHandle.addEventListener("pointercancel", () => {
        menuDrag = null;
      });

      function focusRemoteKeyboard(force = false) {
        if (!rfb || !connected || document.hidden) return;
        if (force && document.activeElement === pasteInput) pasteInput.blur();
        rfb.viewOnly = false;
        if (
          document.activeElement !== pasteInput &&
          typeof rfb.focus === "function"
        )
          rfb.focus();
      }
      const screen = document.getElementById("screen");
      const pasteInput = document.getElementById("paste-input");
      function controlKey(letter) {
        rfb.sendKey(0xffeb, "MetaLeft", false);
        rfb.sendKey(0xffec, "MetaRight", false);
        rfb.sendKey(0xffe3, "ControlLeft", true);
        rfb.sendKey(letter.charCodeAt(0), "Key" + letter.toUpperCase());
        rfb.sendKey(0xffe3, "ControlLeft", false);
      }
      async function pasteText(text) {
        if (!connected)
          throw new Error("Connect to the application browser before pasting.");
        await focusApplication();
        // Insert as text in the selected employer field. This does not depend on
        // X11 clipboard ownership or send Enter keystrokes that could submit a form.
        for (const [key, code] of [
          [0xffeb, "MetaLeft"],
          [0xffec, "MetaRight"],
          [0xffe3, "ControlLeft"],
          [0xffe4, "ControlRight"],
        ])
          rfb.sendKey(key, code, false);
        const response = await fetch(
          "/api/apply/" + encodeURIComponent(session) + "/paste",
          {
            method: "POST",
            headers: { ...headers, "Content-Type": "application/json" },
            body: JSON.stringify({ text }),
          },
        );
        if (!response.ok) {
          const result = await response.json().catch(() => ({}));
          throw new Error(
            result.error ||
              "Paste failed. Select an employer field and try again.",
          );
        }
        pasteInput.value = "";
        focusRemoteKeyboard(true);
        status.textContent = "Connected to application browser";
      }
      document.addEventListener(
        "paste",
        (event) => {
          if (event.target !== pasteInput && !screen.contains(event.target))
            return;
          const text = event.clipboardData?.getData("text/plain");
          if (text === undefined) return;
          event.preventDefault();
          event.stopImmediatePropagation();
          void pasteText(text).catch((error) => {
            pasteInput.value = "";
            status.textContent = error.message;
          });
        },
        true,
      );
      screen.addEventListener(
        "keydown",
        (event) => {
          if (!(event.metaKey || event.ctrlKey) || !connected) return;
          const key = event.key.toLowerCase();
          if (event.metaKey && ["a", "x", "z", "y"].includes(key)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            controlKey(key);
            return;
          }
          if (key !== "v" && key !== "c") return;
          event.stopImmediatePropagation();
          if (key === "c") {
            event.preventDefault();
            copyRequested = true;
            controlKey("c");
            return;
          }
          // Keep the browser's native paste action. Focus an editable target so the
          // paste event supplies text without requesting clipboard-read permission.
          pasteInput.value = "";
          pasteInput.focus({ preventScroll: true });
        },
        true,
      );
      async function focusApplication() {
        if (!focusRequest) {
          focusRequest = (async () => {
            const response = await fetch(
              "/api/apply/" + encodeURIComponent(session) + "/focus",
              { method: "POST", headers },
            );
            if (!response.ok)
              throw new Error("This application browser session has ended.");
          })().finally(() => {
            focusRequest = null;
          });
        }
        // Never disable RFB while awaiting a screenshot or network response:
        // doing so drops keystrokes and can leave the viewer read-only on errors.
        await focusRequest;
        focusRemoteKeyboard();
      }
      window.addEventListener("message", (event) => {
        if (event.origin !== location.origin || event.source !== window.parent ||
            event.data?.type !== "moya:viewer-command" || event.data.sessionId !== session) return;
        switch (event.data.action) {
          case "refresh-menu": void reloadEmployerMenu().catch(() => {}); break;
          case "toggle-menu": menuHandle.click(); break;
          case "focus": void focusApplication().catch((error) => { status.textContent = error.message; }); break;
          case "fit":
          case "actual-size":
            if (rfb) {
              const fit = event.data.action === "fit";
              rfb.scaleViewport = fit;
              rfb.clipViewport = !fit;
              rfb.dragViewport = !fit;
            }
            break;
        }
      });
      try {
        if (!session)
          throw new Error("Open the browser from an application page.");
        const response = await fetch("/api/viewer/config", { headers });
        const config = await response.json();
        if (!response.ok)
          throw new Error(config.error || "Viewer configuration unavailable.");
        await reloadEmployerMenu().catch(() => {});
        menuTimer = setInterval(() => {
          if (connected && !document.hidden)
            void reloadEmployerMenu().catch(() => {});
        }, 1000);
        const { default: RFB } = await import("/vnc/core/rfb.js");
        const socket = new URL("/vnc/websockify", location.href);
        socket.protocol = location.protocol === "https:" ? "wss:" : "ws:";
        rfb = new RFB(document.getElementById("screen"), socket.href, {
          credentials: { password: config.password },
        });
        rfb.scaleViewport = true;
        rfb.resizeSession = false;
        rfb.addEventListener("connect", () => {
          connected = true;
          status.textContent = "Connected to application browser";
          void focusApplication().catch((error) => {
            status.textContent = error.message;
          });
        });
        screen.addEventListener("pointerdown", () => {
          focusRemoteKeyboard(true);
          void focusApplication().catch((error) => {
            status.textContent = error.message;
          });
        });
        rfb.addEventListener("disconnect", () => {
          connected = false;
          status.textContent =
            "Browser disconnected. Reopen this viewer to reconnect.";
        });
        rfb.addEventListener("clipboard", (event) => {
          if (copyRequested) {
            copyRequested = false;
            void navigator.clipboard.writeText(event.detail.text).catch(() => {
              status.textContent =
                "Allow clipboard access for this page to copy text.";
            });
          }
        });
        rfb.addEventListener("securityfailure", () => {
          status.textContent =
            "Browser authentication failed. Check WEB_VNC_PASSWORD and restart the app.";
        });
        window.addEventListener("focus", () => {
          void focusApplication().catch((error) => {
            status.textContent = error.message;
          });
        });
        window.addEventListener("blur", () => {
          if (rfb) rfb.viewOnly = true;
        });
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) {
            if (rfb) rfb.viewOnly = true;
          } else
            void focusApplication().catch((error) => {
              status.textContent = error.message;
            });
        });
        window.addEventListener("pagehide", () => {
          clearInterval(menuTimer);
          rfb.disconnect();
        });
      } catch (error) {
        status.textContent =
          error.message || "Could not connect to application browser.";
      }
    </script>
  </body>
</html>
