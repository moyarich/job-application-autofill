name: Update editor dependency lockfile (temporary)
on:
  push:
    branches:
      - feat/slate-remark-mdast-hotkeys
    paths:
      - .github/workflows/update_editor_lock_temp.yml
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/slate-remark-mdast-hotkeys
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve package lock using npm
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Lock remark, unified, mdast and is-hotkey dependencies"
            git push origin HEAD:feat/slate-remark-mdast-hotkeys
          fi
