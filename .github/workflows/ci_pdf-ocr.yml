name: CI / PDF extraction and OCR

on:
  pull_request:
    paths:
      - "packages/extract-resume/python/pdf_ocr.py"
      - "packages/extract-resume/python/test_pdf_ocr.py"
      - "packages/extract-resume/pyproject.toml"
      - ".github/workflows/ci_pdf-ocr.yml"
  push:
    branches: [main]
    paths:
      - "packages/extract-resume/python/pdf_ocr.py"
      - "packages/extract-resume/python/test_pdf_ocr.py"
      - "packages/extract-resume/pyproject.toml"
      - ".github/workflows/ci_pdf-ocr.yml"

permissions:
  contents: read

jobs:
  python-pdf-ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/extract-resume/pyproject.toml
      - name: Install Python OCR dependencies
        run: python -m pip install -e 'packages/extract-resume[test]'
      - name: Python syntax check
        run: python -m compileall -q packages/extract-resume/python/pdf_ocr.py packages/extract-resume/python/test_pdf_ocr.py
      - name: PDF parsing and scanned-page fallback tests
        run: python -m unittest discover -s packages/extract-resume/python -p 'test_*.py' -v
