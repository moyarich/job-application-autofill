name: CI / PDF extraction and OCR

on:
  pull_request:
    paths:
      - "packages/resume-ocr/**"
      - "packages/resume-ocr/tests/test_pdf_ocr.py"
      - "packages/resume-ocr/pyproject.toml"
      - "packages/resume-ocr/poetry.lock"
      - ".github/workflows/ci_pdf-ocr.yml"
  push:
    branches: [main]
    paths:
      - "packages/resume-ocr/**"
      - "packages/resume-ocr/tests/test_pdf_ocr.py"
      - "packages/resume-ocr/pyproject.toml"
      - "packages/resume-ocr/poetry.lock"
      - ".github/workflows/ci_pdf-ocr.yml"

permissions:
  contents: read

jobs:
  python-pdf-ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.10"
          cache: pip
      - name: Install Poetry
        run: pipx install poetry
      - name: Resolve and install PDF/OCR dependencies
        working-directory: packages/resume-ocr
        run: |
          poetry check --lock
          poetry install --with test
      - name: Confirm Python 3.14 runtime
        working-directory: packages/resume-ocr
        run: poetry run python -c 'import sys; assert sys.version_info[:2] == (3, 14), sys.version'
      - name: Python syntax check
        working-directory: packages/resume-ocr
        run: poetry run python -m compileall -q resume_ocr tests
      - name: PDF parsing and scanned-page fallback tests
        working-directory: packages/resume-ocr
        run: poetry run python -m unittest discover -s tests -p 'test_*.py' -v
