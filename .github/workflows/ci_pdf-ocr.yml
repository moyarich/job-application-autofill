name: CI / PDF extraction and OCR

on:
  pull_request:
    paths:
      - "server/pdf_ocr.py"
      - "server/test_pdf_ocr.py"
      - "server/requirements-ocr.txt"
      - ".github/workflows/ci_pdf-ocr.yml"
  push:
    branches: [main]
    paths:
      - "server/pdf_ocr.py"
      - "server/test_pdf_ocr.py"
      - "server/requirements-ocr.txt"
      - ".github/workflows/ci_pdf-ocr.yml"

permissions:
  contents: read

jobs:
  python-pdf-ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-ocr.txt
      - name: Install Python OCR dependencies
        run: python -m pip install -r server/requirements-ocr.txt reportlab
      - name: Python syntax check
        run: python -m compileall -q server/pdf_ocr.py server/test_pdf_ocr.py
      - name: PDF parsing and scanned-page fallback tests
        run: python -m unittest server.test_pdf_ocr -v
