name: CI / Application viewer keyboard and clipboard

on:
  pull_request:
    paths:
      - "packages/job-application-autofill/public/application-viewer.html"
      - "packages/job-application-autofill/src/**"
      - "packages/job-application-autofill/vite.app.config.ts"
      - "tests/viewer/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci_application-viewer.yml"
  push:
    branches: [main]
    paths:
      - "packages/job-application-autofill/public/application-viewer.html"
      - "packages/job-application-autofill/src/**"
      - "packages/job-application-autofill/vite.app.config.ts"
      - "tests/viewer/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci_application-viewer.yml"

permissions:
  contents: read

jobs:
  viewer-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --include=optional --no-audit --no-fund
      - name: Build workspace packages for app imports
        run: npm run build:js
      - name: Install browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Viewer and application-page regression tests
        run: npx --no-install playwright test tests/viewer
