name: CI / Docker Compose

on:
  pull_request:
    paths:
      - "docker-compose.yml"
      - ".dockerignore"
      - "docker/**"
      - "apps/playground/vite.config.ts"
      - "server/**"
      - "packages/extract-resume/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci_docker.yml"
  push:
    branches: [main]
    paths:
      - "docker-compose.yml"
      - ".dockerignore"
      - "docker/**"
      - ".github/workflows/ci_docker.yml"

permissions:
  contents: read

jobs:
  docker-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WEB_VNC_PASSWORD: "testpass123"
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose definition
        run: docker compose config --quiet
      - name: Build application image
        run: docker compose build
      - name: Start application
        run: docker compose up -d --no-build
      - name: Smoke-test frontend, API and browser viewer
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:5173/ >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:5173/ | grep -q '<div id="root"></div>'
          curl --fail --silent --show-error http://127.0.0.1:5173/api/health | grep -q '"ok":true'
          curl --fail --silent --show-error http://127.0.0.1:6080/vnc.html | grep -qi 'novnc'
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop containers
        if: always()
        run: docker compose down -v --remove-orphans
