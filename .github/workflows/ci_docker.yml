name: CI / Docker Compose

on:
  pull_request:
    paths:
      - "docker-compose.yml"
      - "docker-compose.dev.yml"
      - "tests/docker/**"
      - ".dockerignore"
      - "docker/**"
      - "packages/resume/python/**"
      - "apps/playground/vite.config.ts"
      - "server/**"
      - "playwright-adapters/**"
      - "packages/extract-resume/**"
      - "resume-schema/**"
      - "tests/ats/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci_docker.yml"
  push:
    branches: [main]
    paths:
      - "docker-compose.yml"
      - ".dockerignore"
      - "docker/**"
      - ".github/workflows/ci_docker.yml"

permissions:
  contents: read

jobs:
  arm64-image-build:
    name: ARM64 Docker image build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      WEB_VNC_PASSWORD: "testpass123"
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose definition
        run: docker compose config --quiet
      - name: Build native ARM64 API, OCR and frontend images
        run: docker compose build

  docker-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WEB_VNC_PASSWORD: "testpass123"
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose definition
        run: docker compose config --quiet
      - name: Build API, OCR and frontend images
        run: docker compose build
      - name: Start application
        run: |
          mkdir -p sqlite-data
          docker compose up -d --no-build
      - name: Verify Chromium and Python OCR are compartmentalized
        run: |
          docker compose exec -T api node -e 'const {chromium}=require("playwright"); (async()=>{const headed=await chromium.launch({headless:false}); await headed.close(); const headless=await chromium.launch({headless:true}); await headless.close()})().catch(e=>{console.error(e);process.exit(1)})'
          docker compose exec -T api sh -c 'test ! -e /opt/venv && test -n "$OCR_SERVICE_URL"'
          docker compose exec -T web sh -c 'test ! -e /opt/venv && ! command -v Xvfb'
          docker compose exec -T ocr /opt/venv/bin/python -c 'import sys, pypdfium2, onnxruntime; from rapidocr import RapidOCR; assert sys.version_info[:2] == (3, 14), sys.version'
          docker compose exec -T ocr sh -c '! command -v node && ! command -v chromium'
      - name: Verify PDF extraction through the internal OCR service
        run: |
          docker compose exec -T api node --input-type=module -e '
            import { chromium } from "playwright";
            const browser = await chromium.launch();
            try {
              const page = await browser.newPage();
              await page.setContent("<p>Ada Lovelace resume text extraction smoke test with several words</p>");
              const pdf = await page.pdf();
              const response = await fetch(process.env.OCR_SERVICE_URL + "/extract", {
                method: "POST", headers: {"Content-Type":"application/pdf"}, body: new Uint8Array(pdf)
              });
              const result = await response.json();
              if (!response.ok || !result.text?.includes("Ada Lovelace")) throw new Error(JSON.stringify(result));
            } finally { await browser.close(); }
          '
      - name: Report image sizes
        run: |
          docker image ls job-application-autofill-api
          docker image ls job-application-autofill-web
          docker image ls job-application-autofill-ocr
      - name: Smoke-test frontend, API and browser viewer
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:5173/ >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:5173/ | grep -q '<div id="root"></div>'
          curl --fail --silent --show-error http://127.0.0.1:5173/api/health | grep -q '"ok":true'
          curl --fail --silent --show-error http://127.0.0.1:6080/vnc.html | grep -qi 'novnc'
      - name: Check Xvfb keyboard mapping for unresolved XF86 symbols
        run: |
          logs="$(docker compose logs --no-color api)"
          if grep -q 'Could not resolve keysym XF86' <<< "$logs"; then
            echo "::error::Xvfb keyboard layout contains unknown XF86 keysyms"
            grep 'Could not resolve keysym XF86' <<< "$logs"
            exit 1
          fi
      - name: ATS browser adapter integration fixtures
        run: docker compose exec -T api npx --no-install vitest run tests/ats
      - name: Verify SQLite persists after Compose shutdown and restart
        run: |
          docker compose exec -T api sh -c 'test -f /app/data/job_application_autofill.sqlite && printf "persistent" > /app/data/.ci-volume-marker'
          test -f sqlite-data/job_application_autofill.sqlite
          test "$(cat sqlite-data/.ci-volume-marker)" = persistent
          docker compose down
          docker compose up -d --no-build
          docker compose exec -T api sh -c 'test -f /app/data/job_application_autofill.sqlite && test "$(cat /app/data/.ci-volume-marker)" = persistent'
          test -f sqlite-data/job_application_autofill.sqlite
          test "$(cat sqlite-data/.ci-volume-marker)" = persistent
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/api/health | grep -q '"ok":true'; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::API did not recover after Docker Compose restart"
          exit 1
      - name: Verify SQLite directory is ignored by Git and Docker builds
        run: |
          git check-ignore -q sqlite-data/job_application_autofill.sqlite
          grep -qx 'sqlite-data/' .dockerignore
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop containers
        if: always()
        run: docker compose down -v --remove-orphans
